syntax = "proto3";

package orders.v1;

import "errors/errors.proto";

option go_package = "github.com/makesalekz/orders/api/orders/v1;orders_v1";

enum ErrorReason {
  option (errors.default_code) = 500;

  INTERNAL = 0;
  NOT_FOUND = 1 [(errors.code) = 404];
  INVALID_REQUEST = 2 [(errors.code) = 400];
  FORBIDDEN = 3 [(errors.code) = 403];
  INVALID_STATUS_TRANSITION = 4 [(errors.code) = 400];
}
