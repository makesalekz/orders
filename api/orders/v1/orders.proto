syntax = "proto3";

package orders.v1;

option go_package = "gitlab.calendaria.team/services/orders/api/orders/v1;orders_v1";

import "api/orders/v1/models.proto";
import "api/utils/v1/models.proto";

service OrdersService {
  // Story 5.1: Create order
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderReply);
  rpc GetOrder(GetOrderRequest) returns (GetOrderReply);

  // Story 5.2: Status transitions
  rpc ConfirmOrder(ConfirmOrderRequest) returns (ConfirmOrderReply);
  rpc ShipOrder(ShipOrderRequest) returns (ShipOrderReply);
  rpc AcceptOrder(AcceptOrderRequest) returns (AcceptOrderReply);
  rpc RejectOrder(RejectOrderRequest) returns (RejectOrderReply);

  // Story 5.3: Order suggestions from stock
  rpc GetOrderSuggestions(GetOrderSuggestionsRequest) returns (GetOrderSuggestionsReply);

  // Story 5.4: Order history
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersReply);
}

// --- 5.1 Create Order ---

message CreateOrderItemRequest {
  int64 product_id = 1;
  string quantity = 2;
  string unit_price = 3;
}

message CreateOrderRequest {
  int64 counterparty_id = 1;
  repeated CreateOrderItemRequest items = 2;
}

message CreateOrderReply {
  Order order = 1;
}

message GetOrderRequest {
  int64 id = 1;
}

message GetOrderReply {
  Order order = 1;
}

// --- 5.2 Status transitions ---

message ConfirmOrderRequest {
  int64 id = 1;
}

message ConfirmOrderReply {
  Order order = 1;
}

message ShipOrderRequest {
  int64 id = 1;
}

message ShipOrderReply {
  Order order = 1;
}

message AcceptOrderRequest {
  int64 id = 1;
}

message AcceptOrderReply {
  Order order = 1;
}

message RejectOrderRequest {
  int64 id = 1;
}

message RejectOrderReply {
  Order order = 1;
}

// --- 5.3 Order suggestions ---

message GetOrderSuggestionsRequest {
  int64 warehouse_id = 1;
}

message GetOrderSuggestionsReply {
  repeated OrderSuggestion items = 1;
}

// --- 5.4 List orders ---

message ListOrdersRequest {
  int64 counterparty_id = 1;
  OrderStatus status = 2;
  bool filter_status = 3;
  utils.v1.PaginateRequest paginate = 4;
}

message ListOrdersReply {
  repeated Order items = 1;
  utils.v1.PaginateReply paginate = 2;
}
